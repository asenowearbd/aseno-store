<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASENO Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#171b13;color:#f5f1e8;font-family:Arial,sans-serif}
.panel{max-width:650px;margin:25px auto;padding:24px;background:#22271c;border:1px solid #505541;border-radius:14px}
h1{color:#d4ddba;letter-spacing:4px}
label{display:block;margin-top:16px}
input,textarea,select{width:100%;padding:12px;margin-top:7px;background:#171b13;color:white;border:1px solid #555c48;border-radius:7px;font-size:16px}
button{padding:13px;margin-top:18px;width:100%;border:0;border-radius:7px;background:#d4ddba;color:#171b13;font-weight:bold;font-size:16px}
.note{color:#c2c6b9;line-height:1.5}
</style>
</head>
<body>
<main class="panel">
<h1>ASENO</h1>
<p class="note">STORE MANAGEMENT · ADMIN DASHBOARD</p>

<section id="login">
<h2>Admin Login</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required autocomplete="username">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button id="loginButton">Sign in</button>
</form>
</section>

<section id="manager" hidden>
<h2>Product Management</h2>
<form id="productForm">
<label>Product name</label>
<input id="productName" required placeholder="ASENO Oversized Tee">
<label>Price (BDT)</label>
<input id="price" type="number" min="0" step="1" required placeholder="550">
<label>Description</label>
<textarea id="description" placeholder="Product details"></textarea>
<label>Product image URL</label>
<input id="imageUrl" type="url" placeholder="https://...">
<label>Category</label>
<select id="category">
<option value="tshirt">T-shirt</option>
<option value="custom">Custom Print</option>
</select>
<button id="saveButton" type="submit">Save Product</button>
</form>
<h3>Save result</h3>
<p id="productMessage" class="note" role="status"></p>
<button id="logoutButton" type="button">Sign out</button>
</section>
<p id="message" class="note" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient(
'https://rksonvrxckilhbgdkfbk.supabase.co',
'sb_publishable_yvsxXpmXI-7Okxf0xMU6gQ_kbitp4DG'
);
const msg=document.getElementById('message');

document.getElementById('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
const b=document.getElementById('loginButton');
b.disabled=true;
msg.textContent='Signing in...';
try{
const {data,error}=await db.auth.signInWithPassword({
email:document.getElementById('email').value.trim(),
password:document.getElementById('password').value
});
if(error)throw error;
const {data:admin,error:adminError}=await db.from('admin_users')
.select('user_id').eq('user_id',data.user.id).maybeSingle();
if(adminError)throw adminError;
if(!admin){
await db.auth.signOut();
throw new Error('This account is not authorized as an admin.');
}
document.getElementById('login').hidden=true;
document.getElementById('manager').hidden=false;
msg.textContent='Login successful.';
}catch(err){msg.textContent=err.message}
finally{b.disabled=false}
});

document.getElementById('productForm').addEventListener('submit',async e=>{
e.preventDefault();
const b=document.getElementById('saveButton');
const result=document.getElementById('productMessage');
b.disabled=true;
result.textContent='Saving product...';
try{
const {data:sessionData}=await db.auth.getSession();
if(!sessionData.session)throw new Error('Please sign in again.');
const product={
name:document.getElementById('productName').value.trim(),
price:Number(document.getElementById('price').value),
description:document.getElementById('description').value.trim()||null,
image_url:document.getElementById('imageUrl').value.trim()||null,
category:document.getElementById('category').value,
is_active:true
};
const {data,error}=await db.from('products').insert(product).select().single();
if(error)throw error;
result.textContent='Product saved successfully! ID: '+data.id;
document.getElementById('productForm').reset();
}catch(err){
result.textContent='Could not save: '+err.message;
}finally{b.disabled=false}
});

document.getElementById('logoutButton').addEventListener('click',async()=>{
await db.auth.signOut();
document.getElementById('manager').hidden=true;
document.getElementById('login').hidden=false;
document.getElementById('password').value='';
msg.textContent='Signed out.';
});
</script>
</body>
</html>
