<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Order | ASENO</title>
<style>
body{margin:0;padding:24px 16px;background:#f5f3eb;color:#25291d;font-family:Arial,sans-serif}
main{max-width:480px;margin:35px auto;background:white;padding:24px;border-radius:18px}
h1{letter-spacing:2px}
input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}
button{background:#343b26;color:white;border:0;font-weight:bold}
#result{margin-top:20px;overflow-wrap:anywhere;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>ASENO</h1>
<p>ORDER TRACKING</p>
<p>Enter your Order ID and phone number.</p>
<form id="trackForm">
<input id="orderId" placeholder="Order ID (e.g. 5F48501C)" required>
<input id="phone" type="tel" placeholder="Your order phone number" required>
<button type="submit">TRACK ORDER</button>
</form>
<div id="result" aria-live="polite"></div>
<p><a href="./index.html">← Back to Store</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  'https://rksonvrxckilhbgdkfbk.supabase.co',
  'sb_publishable_yvsxXpmXI-7Okxf0xMU6gQ_kbitp4DG'
);

document.getElementById('trackForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const result = document.getElementById('result');
  const orderId = document.getElementById('orderId').value.trim().toUpperCase();
  const phone = document.getElementById('phone').value.trim();
  result.textContent = 'Checking order...';

  try {
    const {data, error} = await db
      .from('orders')
      .select('id,order_code,created_at,status,total_amount,payment_method,payment_status,phone')
      .eq('phone', phone)
      .order('created_at', {ascending:false})
      .limit(50);

    if (error) throw error;

    const order = (data || []).find(o =>
  String(o.order_code || '').toUpperCase() === orderId ||
  String(o.id).replace(/-/g, '').slice(0, 8).toUpperCase() === orderId
);

    if (!order) {
      result.textContent = 'Order not found. Please check your Order ID and phone number.';
      return;
    }

    const {data: items, error: itemError} = await db
      .from('order_items')
      .select('product_name,color,size,quantity')
      .eq('order_id', order.id);

    if (itemError) throw itemError;

    result.replaceChildren();
    const heading = document.createElement('h3');
    heading.textContent = 'Order Found ✓';
    result.appendChild(heading);

    const details = document.createElement('pre');
    details.style.whiteSpace = 'pre-wrap';
    details.textContent =
      'Order ID: ' + (order.order_code || orderId) +
      '\nStatus: ' + order.status +
      '\nTotal: ৳' + order.total_amount +
      '\nPayment: ' + (order.payment_method || 'N/A') +
      '\nPayment status: ' + (order.payment_status || 'N/A') +
      '\n\nItems:\n' + ((items || []).map(i =>
        `${i.product_name} — ${i.color}, ${i.size} × ${i.quantity}`
      ).join('\n') || 'No items found');
    result.appendChild(details);
  } catch (err) {
    console.error(err);
    result.textContent = 'Could not check order. Database access may need configuration.';
  }
});
</script>
</body>
</html>
